version: '3.8'

# Stack de PRODUCCIÓN de un solo host — pensado para la VM Always Free de Oracle
# Cloud (u otra VPS equivalente) detrás de Cloudflare. Distinto de
# docker-compose.yml (que solo levanta infraestructura para desarrollo local,
# donde los microservicios corren directo en el host vía `./uniwheels`): aquí
# TODO corre en contenedores, incluidos los 6 microservicios y el frontend.
#
# Ver docker/DEPLOY.md para la guía paso a paso (cuenta, DNS, primer arranque).

services:
  postgres_gis:
    image: docker.io/postgis/postgis:16-3.4-alpine
    container_name: uniwheels_postgres_gis
    restart: unless-stopped
    environment:
      POSTGRES_USER: uniwheels_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MULTIPLE_DATABASES: "auth_db,vehicle_db,route_gis_db,trip_db,notification_db"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-multi-db.sh:/docker-entrypoint-initdb.d/init-multi-db.sh:Z
    networks: [uniwheels_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uniwheels_user"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Sin `ports:` — nadie fuera de la red interna de Docker necesita llegar a
    # Postgres directamente. Para psql manual desde la VM: `docker compose exec`.

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: uniwheels_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    networks: [uniwheels_net]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  osrm_backend:
    image: docker.io/osrm/osrm-backend:latest
    container_name: uniwheels_osrm
    restart: unless-stopped
    volumes:
      - ./osrm-data:/data
    command: osrm-routed --algorithm mld /data/santander.osrm
    networks: [uniwheels_net]

  uptime_kuma:
    image: docker.io/louislam/uptime-kuma:1
    container_name: uniwheels_uptime_kuma
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - uptime_kuma_data:/app/data
    networks: [uniwheels_net]

  auth-service:
    build:
      context: ../services/auth-service
      dockerfile: ../../docker/php-service.Dockerfile
      args:
        SERVICE_PORT: 8001
    container_name: uniwheels_auth_service
    restart: unless-stopped
    env_file: ../services/auth-service/.env.production
    depends_on:
      postgres_gis: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [uniwheels_net]
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8001) ? 0 : 1);"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  vehicle-service:
    build:
      context: ../services/vehicle-service
      dockerfile: ../../docker/php-service.Dockerfile
      args:
        SERVICE_PORT: 8002
    container_name: uniwheels_vehicle_service
    restart: unless-stopped
    env_file: ../services/vehicle-service/.env.production
    depends_on:
      postgres_gis: { condition: service_healthy }
    volumes:
      # Documentos de conductores (SOAT, licencia, RTM) en storage/app: sin
      # volumen se perdian en cada recreacion del contenedor.
      - vehicle_storage:/app/storage/app
    networks: [uniwheels_net]
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8002) ? 0 : 1);"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  route-matching-service:
    build:
      context: ../services/route-matching-service
      dockerfile: ../../docker/php-service.Dockerfile
      args:
        SERVICE_PORT: 8003
    container_name: uniwheels_route_matching_service
    restart: unless-stopped
    env_file: ../services/route-matching-service/.env.production
    depends_on:
      postgres_gis: { condition: service_healthy }
    networks: [uniwheels_net]
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8003) ? 0 : 1);"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  trip-service:
    build:
      context: ../services/trip-service
      dockerfile: ../../docker/php-service.Dockerfile
      args:
        SERVICE_PORT: 8004
    container_name: uniwheels_trip_service
    restart: unless-stopped
    env_file: ../services/trip-service/.env.production
    depends_on:
      postgres_gis: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [uniwheels_net]
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8004) ? 0 : 1);"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  notification-service:
    build:
      context: ../services/notification-service
      dockerfile: ../../docker/php-service.Dockerfile
      args:
        SERVICE_PORT: 8005
    container_name: uniwheels_notification_service
    restart: unless-stopped
    env_file: ../services/notification-service/.env.production
    depends_on:
      postgres_gis: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [uniwheels_net]
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8005) ? 0 : 1);"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  ai-route-service:
    build:
      context: ../services/ai-route-service
      dockerfile: ../../docker/python-service.Dockerfile
    container_name: uniwheels_ai_route_service
    restart: unless-stopped
    env_file: ../services/ai-route-service/.env.production
    networks: [uniwheels_net]
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket,sys; sys.exit(0 if socket.socket().connect_ex(('127.0.0.1',8006))==0 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  landing:
    build:
      context: ../landing
      dockerfile: ../docker/landing.Dockerfile
    container_name: uniwheels_landing
    restart: unless-stopped
    networks: [uniwheels_net]

  gateway:
    image: docker.io/library/nginx:1.27-alpine
    container_name: uniwheels_gateway
    restart: unless-stopped
    volumes:
      - ../gateway/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ../gateway/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      auth-service: { condition: service_healthy }
      vehicle-service: { condition: service_healthy }
      route-matching-service: { condition: service_healthy }
      trip-service: { condition: service_healthy }
      notification-service: { condition: service_healthy }
      ai-route-service: { condition: service_healthy }
      landing: { condition: service_started }
    networks: [uniwheels_net]

networks:
  uniwheels_net:
    driver: bridge

volumes:
  postgres_data:
  uptime_kuma_data:
  vehicle_storage:

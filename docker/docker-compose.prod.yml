version: '3.8'

# Stack de PRODUCCIÓN de un solo host — pensado para la VM Always Free de Oracle
# Cloud (u otra VPS equivalente) detrás de Cloudflare. Distinto de
# docker-compose.yml (que solo levanta infraestructura para desarrollo local,
# donde los microservicios corren directo en el host vía `./uniwheels`): aquí
# TODO corre en contenedores, incluidos los 6 microservicios y el frontend.
#
# Ver docker/DEPLOY.md para la guía paso a paso (cuenta, DNS, primer arranque).

services:
  postgres_gis:
    image: docker.io/postgis/postgis:16-3.4-alpine
    container_name: uniwheels_postgres_gis
    restart: unless-stopped
    environment:
      POSTGRES_USER: uniwheels_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MULTIPLE_DATABASES: "auth_db,vehicle_db,route_gis_db,trip_db,notification_db"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-multi-db.sh:/docker-entrypoint-initdb.d/init-multi-db.sh:Z
    networks: [uniwheels_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uniwheels_user"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Sin `ports:` — nadie fuera de la red interna de Docker necesita llegar a
    # Postgres directamente. Para psql manual desde la VM: `docker compose exec`.

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: uniwheels_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    networks: [uniwheels_net]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  osrm_backend:
    image: docker.io/osrm/osrm-backend:latest
    container_name: uniwheels_osrm
    restart: unless-stopped
    volumes:
      - ./osrm-data:/data
    command: osrm-routed --algorithm mld /data/santander.osrm
    networks: [uniwheels_net]

  uptime_kuma:
    image: docker.io/louislam/uptime-kuma:1
    container_name: uniwheels_uptime_kuma
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - uptime_kuma_data:/app/data
    networks: [uniwheels_net]

  auth-service:
    build:
      context: ../services/auth-service
      dockerfile: ../../docker/php-service.Dockerfile
      args:
        SERVICE_PORT: 8001
    container_name: uniwheels_auth_service
    restart: unless-stopped
    env_file: ../services/auth-service/.env.production
    depends_on:
      postgres_gis: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [uniwheels_net]

  vehicle-service:
    build:
      context: ../services/vehicle-service
      dockerfile: ../../docker/php-service.Dockerfile
      args:
        SERVICE_PORT: 8002
    container_name: uniwheels_vehicle_service
    restart: unless-stopped
    env_file: ../services/vehicle-service/.env.production
    depends_on:
      postgres_gis: { condition: service_healthy }
    networks: [uniwheels_net]

  route-matching-service:
    build:
      context: ../services/route-matching-service
      dockerfile: ../../docker/php-service.Dockerfile
      args:
        SERVICE_PORT: 8003
    container_name: uniwheels_route_matching_service
    restart: unless-stopped
    env_file: ../services/route-matching-service/.env.production
    depends_on:
      postgres_gis: { condition: service_healthy }
    networks: [uniwheels_net]

  trip-service:
    build:
      context: ../services/trip-service
      dockerfile: ../../docker/php-service.Dockerfile
      args:
        SERVICE_PORT: 8004
    container_name: uniwheels_trip_service
    restart: unless-stopped
    env_file: ../services/trip-service/.env.production
    depends_on:
      postgres_gis: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [uniwheels_net]

  notification-service:
    build:
      context: ../services/notification-service
      dockerfile: ../../docker/php-service.Dockerfile
      args:
        SERVICE_PORT: 8005
    container_name: uniwheels_notification_service
    restart: unless-stopped
    env_file: ../services/notification-service/.env.production
    depends_on:
      postgres_gis: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [uniwheels_net]

  ai-route-service:
    build:
      context: ../services/ai-route-service
      dockerfile: ../../docker/python-service.Dockerfile
    container_name: uniwheels_ai_route_service
    restart: unless-stopped
    env_file: ../services/ai-route-service/.env.production
    networks: [uniwheels_net]

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_VEHICLE_API_URL: ${VITE_VEHICLE_API_URL}
        VITE_ROUTE_API_URL: ${VITE_ROUTE_API_URL}
        VITE_TOMTOM_API_KEY: ${VITE_TOMTOM_API_KEY}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN}
    container_name: uniwheels_frontend
    restart: unless-stopped
    networks: [uniwheels_net]

  gateway:
    image: docker.io/library/nginx:1.27-alpine
    container_name: uniwheels_gateway
    restart: unless-stopped
    volumes:
      - ../gateway/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ../gateway/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - auth-service
      - vehicle-service
      - route-matching-service
      - trip-service
      - notification-service
      - ai-route-service
      - frontend
    networks: [uniwheels_net]

networks:
  uniwheels_net:
    driver: bridge

volumes:
  postgres_data:
  uptime_kuma_data:

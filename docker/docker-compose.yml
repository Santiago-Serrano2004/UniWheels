version: '3.8'

services:
  postgres_gis:
    image: docker.io/postgis/postgis:16-3.4-alpine
    container_name: uniwheels_postgres_gis
    environment:
      POSTGRES_USER: uniwheels_user
      POSTGRES_PASSWORD: secret_postgres_pass
      POSTGRES_MULTIPLE_DATABASES: "auth_db,vehicle_db,route_gis_db,trip_db,notification_db"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-multi-db.sh:/docker-entrypoint-initdb.d/init-multi-db.sh:Z
    ports:
      # Solo accesible desde el propio host, no desde toda la red (era 0.0.0.0 antes).
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uniwheels_user"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: uniwheels_redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-changeme_local_dev}"]
    ports:
      # Solo accesible desde el propio host, no desde toda la red (era 0.0.0.0 antes).
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme_local_dev}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  osrm_backend:
    image: docker.io/osrm/osrm-backend:latest
    container_name: uniwheels_osrm
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./osrm-data:/data
    command: osrm-routed --algorithm mld /data/santander.osrm

  # Monitor externo simple sobre los health-checks reales (`/up` en los 5 servicios
  # Laravel, `/health` en ai-route-service, `/` en el frontend) — avisa si algo se
  # cae mientras nadie está mirando la terminal, algo que `./uniwheels status` no
  # puede hacer porque hay que ejecutarlo manualmente. Self-hosted, sin costo.
  # `network_mode: host` porque los servicios corren con `php artisan serve` /
  # `npm run dev` directamente en el host, no en contenedores — así Kuma les
  # llega por localhost sin depender de host.docker.internal.
  uptime_kuma:
    image: docker.io/louislam/uptime-kuma:1
    container_name: uniwheels_uptime_kuma
    restart: unless-stopped
    network_mode: host
    volumes:
      - uptime_kuma_data:/app/data

volumes:
  postgres_data:
  uptime_kuma_data:

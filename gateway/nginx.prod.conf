# ==============================================================================
# UniWheels API Gateway — Variante de PRODUCCIÓN (docker-compose.prod.yml)
# ==============================================================================
# Copia de nginx.conf (el archivo de referencia para desarrollo/documentación)
# con dos únicos cambios: los upstreams apuntan a los nombres de servicio de la
# red interna de Docker Compose en vez de 127.0.0.1:PUERTO, y el frontend apunta
# al contenedor Nginx que sirve el build estático (frontend/Dockerfile) en vez
# del servidor de desarrollo de Vite. Mantener ambos archivos en sync a mano si
# se toca la lógica de rutas/seguridad — no hay generación automática entre ellos.

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    # --- 1. Rate Limiting Zones (Protección Anti-DDoS y Brute-Force) ---
    limit_req_zone $binary_remote_addr zone=api_gateway_limit:10m rate=40r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=addr_limit:10m;

    # --- 2. Upstream Microservices (nombres de servicio de docker-compose.prod.yml) ---
    upstream auth_service {
        server auth-service:8001 max_fails=3 fail_timeout=10s;
    }

    upstream vehicle_service {
        server vehicle-service:8002 max_fails=3 fail_timeout=10s;
    }

    upstream route_matching_service {
        server route-matching-service:8003 max_fails=3 fail_timeout=10s;
    }

    upstream trip_service {
        server trip-service:8004 max_fails=3 fail_timeout=10s;
    }

    upstream notification_service {
        server notification-service:8005 max_fails=3 fail_timeout=10s;
    }

    upstream ai_route_service {
        server ai-route-service:8006 max_fails=3 fail_timeout=10s;
    }

    upstream frontend_spa {
        server frontend:80 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        # Reemplazar por el dominio real una vez registrado y apuntado en Cloudflare
        # (ver docker/DEPLOY.md) — Cloudflare en modo "Flexible" o "Full" hace HTTPS
        # de cara al navegador y reenvía en HTTP plano a este puerto 80, así que no
        # hace falta certificado en este origen para tener candado verde real.
        server_name localhost uniwheels.unab.edu.co _;

        # --- 3. Cabeceras de Seguridad Globales (OWASP Security Headers) ---
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://*.tile.openstreetmap.org https://server.arcgisonline.com; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' http://localhost:* ws://localhost:* https://api.tomtom.com;" always;

        # Ocultar versión de Nginx (Prevenir Information Disclosure)
        server_tokens off;

        # Tamaño máximo de carga para documentos vehiculares (10MB)
        client_max_body_size 10M;

        # --- 4a. Rutas de autenticación sensibles a fuerza bruta (login/PIN) ---
        location ~ ^/api/v1/auth/(login|register|forgot-password|reset-password|send-verification-code) {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- 4b. Microservicio de Autenticación e Identidad (:8001) ---
        location ~ ^/api/v1/(auth|institutions|user|wallet|driver/register) {
            limit_req zone=api_gateway_limit burst=20 nodelay;
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- 5. Microservicio de Vehículos y Documentos (:8002) ---
        location ~ ^/api/v1/vehicles {
            limit_req zone=api_gateway_limit burst=20 nodelay;
            proxy_pass http://vehicle_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- 6. Microservicio Geoespacial y Matching PostGIS (:8003) ---
        location ~ ^/api/v1/routes {
            limit_req zone=api_gateway_limit burst=30 nodelay;
            proxy_pass http://route_matching_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- 7. Microservicio de Ciclo de Vida del Viaje y Telemetría (:8004) ---
        location ~ ^/api/v1/(trips|passenger) {
            limit_req zone=api_gateway_limit burst=30 nodelay;
            proxy_pass http://trip_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- 8. Microservicio de Notificaciones Push (:8005) ---
        location ~ ^/api/v1/(notifications|users) {
            limit_req zone=api_gateway_limit burst=20 nodelay;
            proxy_pass http://notification_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- 9. Microservicio de Inteligencia Artificial FastAPI (:8006) ---
        location ~ ^/api/v1/(optimize|ai) {
            limit_req zone=api_gateway_limit burst=30 nodelay;
            proxy_pass http://ai_route_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- 10. Frontend React SPA (:5173) ---
        location / {
            proxy_pass http://frontend_spa;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }

    # --- 11. TLS — REQUERIDO antes de cualquier entorno no local ---
    # Deshabilitado por defecto en este repo porque el entorno de desarrollo local
    # no trae certificados. Para producción: generar/instalar el certificado real
    # (Let's Encrypt/certbot o el emitido por la universidad) en las rutas de abajo,
    # descomentar este bloque, y añadir un `return 301 https://$host$request_uri;`
    # en el `server { listen 80; ... }` de arriba para forzar el redirect.
    #
    # server {
    #     listen 443 ssl;
    #     server_name uniwheels.unab.edu.co;
    #
    #     ssl_certificate     /etc/nginx/certs/uniwheels.crt;
    #     ssl_certificate_key /etc/nginx/certs/uniwheels.key;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #
    #     # ... replicar aquí los mismos `location` del server de puerto 80 ...
    # }
}

# ==============================================================================
# UniWheels API Gateway — Variante de PRODUCCIÓN (docker-compose.prod.yml)
# ==============================================================================
# Configurado para TLS Full al origen con Cloudflare Origin CA Certificate.
# Puerto 80 redirige 301 a HTTPS (443).
# Ver docker/DEPLOY.md paso 3 / 4.2 para la gestión de certificados origin.crt / origin.key.

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    # --- 1. Rate Limiting Zones (Protección Anti-DDoS y Brute-Force) ---
    # Aumentar zona de API Gateway para soportar telemetría GPS continua desde NATs universitarios
    limit_req_zone $binary_remote_addr zone=api_gateway_limit:10m rate=80r/s;
    limit_req_zone $binary_remote_addr zone=tracking_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=addr_limit:10m;

    # --- 2. Upstream Microservices (nombres de servicio de docker-compose.prod.yml) ---
    upstream auth_service {
        server auth-service:8001 max_fails=3 fail_timeout=10s;
    }

    upstream vehicle_service {
        server vehicle-service:8002 max_fails=3 fail_timeout=10s;
    }

    upstream route_matching_service {
        server route-matching-service:8003 max_fails=3 fail_timeout=10s;
    }

    upstream trip_service {
        server trip-service:8004 max_fails=3 fail_timeout=10s;
    }

    upstream notification_service {
        server notification-service:8005 max_fails=3 fail_timeout=10s;
    }

    upstream ai_route_service {
        server ai-route-service:8006 max_fails=3 fail_timeout=10s;
    }

    upstream landing {
        server landing:80 max_fails=3 fail_timeout=10s;
    }

    upstream admin {
        server admin:80 max_fails=3 fail_timeout=10s;
    }

    # --- HTTP: Redirección permanente 301 a HTTPS ---
    server {
        listen 80;
        server_name localhost uniwheels.unab.edu.co admin.uniwheels.org _;
        return 301 https://$host$request_uri;
    }

    # --- HTTPS: Landing Page y API Pública (uniwheels.org / uniwheels.unab.edu.co) ---
    server {
        listen 443 ssl;
        http2 on;
        server_name localhost uniwheels.unab.edu.co _;

        # Certificados de origen montados desde gateway/certs (ver docker/DEPLOY.md)
        ssl_certificate     /etc/nginx/certs/origin.crt;
        ssl_certificate_key /etc/nginx/certs/origin.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # --- 3. Cabeceras de Seguridad Globales (OWASP Security Headers) ---
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://*.tile.openstreetmap.org https://server.arcgisonline.com; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' http://localhost:* ws://localhost:* https://api.tomtom.com;" always;

        # Ocultar versión de Nginx (Prevenir Information Disclosure)
        server_tokens off;

        # Tamaño máximo de carga para documentos vehiculares (10MB)
        client_max_body_size 10M;

        # --- Rutas de API compartidas ---
        include /etc/nginx/api-locations.conf;

        # --- 10. Landing Page React (:80) ---
        location / {
            proxy_pass http://landing;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # --- HTTPS: Panel de Administración (admin.uniwheels.org) ---
    server {
        listen 443 ssl;
        http2 on;
        server_name admin.uniwheels.org;

        # Certificados de origen montados desde gateway/certs (ver docker/DEPLOY.md)
        ssl_certificate     /etc/nginx/certs/origin.crt;
        ssl_certificate_key /etc/nginx/certs/origin.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # --- 3. Cabeceras de Seguridad Globales (OWASP Security Headers) ---
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://server.arcgisonline.com; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' http://localhost:* ws://localhost:*;" always;

        # Ocultar versión de Nginx (Prevenir Information Disclosure)
        server_tokens off;

        # Tamaño máximo de carga para documentos vehiculares (10MB)
        client_max_body_size 10M;

        # --- Rutas de API compartidas (mismo origen para no depender de CORS) ---
        include /etc/nginx/api-locations.conf;

        # --- Panel de Administración React (:80) ---
        location / {
            proxy_pass http://admin;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}

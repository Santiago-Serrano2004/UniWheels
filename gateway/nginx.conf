# ==============================================================================
# UniWheels API Gateway — Nginx Configuration & Security Hardening
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    # --- 1. Rate Limiting Zones (Protección Anti-DDoS y Brute-Force) ---
    limit_req_zone $binary_remote_addr zone=api_gateway_limit:10m rate=40r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=addr_limit:10m;

    # --- 2. Upstream Microservices ---
    upstream auth_service {
        server 127.0.0.1:8001 max_fails=3 fail_timeout=10s;
    }

    upstream vehicle_service {
        server 127.0.0.1:8002 max_fails=3 fail_timeout=10s;
    }

    upstream route_matching_service {
        server 127.0.0.1:8003 max_fails=3 fail_timeout=10s;
    }

    upstream trip_service {
        server 127.0.0.1:8004 max_fails=3 fail_timeout=10s;
    }

    upstream notification_service {
        server 127.0.0.1:8005 max_fails=3 fail_timeout=10s;
    }

    upstream ai_route_service {
        server 127.0.0.1:8006 max_fails=3 fail_timeout=10s;
    }

    upstream frontend_spa {
        server 127.0.0.1:5173 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name localhost uniwheels.unab.edu.co;

        # --- 3. Cabeceras de Seguridad Globales (OWASP Security Headers) ---
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' http://localhost:* ws://localhost:* https://api.tomtom.com;" always;

        # Ocultar versión de Nginx (Prevenir Information Disclosure)
        server_tokens off;

        # Tamaño máximo de carga para documentos vehiculares (10MB)
        client_max_body_size 10M;

        # --- 4. Microservicio de Autenticación e Identidad (:8001) ---
        location ~ ^/api/v1/(auth|institutions|user|wallet|driver/register) {
            limit_req zone=api_gateway_limit burst=20 nodelay;
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- 5. Microservicio de Vehículos y Documentos (:8002) ---
        location ~ ^/api/v1/vehicles {
            limit_req zone=api_gateway_limit burst=20 nodelay;
            proxy_pass http://vehicle_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- 6. Microservicio Geoespacial y Matching PostGIS (:8003) ---
        location ~ ^/api/v1/routes {
            limit_req zone=api_gateway_limit burst=30 nodelay;
            proxy_pass http://route_matching_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- 7. Microservicio de Ciclo de Vida del Viaje y Telemetría (:8004) ---
        location ~ ^/api/v1/(trips|passenger) {
            limit_req zone=api_gateway_limit burst=30 nodelay;
            proxy_pass http://trip_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- 8. Microservicio de Notificaciones Push (:8005) ---
        location ~ ^/api/v1/(notifications|users) {
            limit_req zone=api_gateway_limit burst=20 nodelay;
            proxy_pass http://notification_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- 9. Microservicio de Inteligencia Artificial FastAPI (:8006) ---
        location ~ ^/api/v1/(optimize|ai) {
            limit_req zone=api_gateway_limit burst=30 nodelay;
            proxy_pass http://ai_route_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- 10. Frontend React SPA (:5173) ---
        location / {
            proxy_pass http://frontend_spa;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }
}

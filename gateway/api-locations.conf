# ==============================================================================
# Rutas de API Compartidas — UniWheels API Gateway
# ==============================================================================
# Incluido por los server blocks de uniwheels.org y admin.uniwheels.org para
# enrutar a los microservicios sin depender de CORS en el mismo origen.

# --- 4-admin. Rutas del Panel de Administración ---
location ~ ^/api/v1/admin/(vehicles|documents) {
    limit_req zone=api_gateway_limit burst=20 nodelay;
    proxy_pass http://vehicle_service;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

location ~ ^/api/v1/admin/(sos-events|trips|payments/trips) {
    limit_req zone=api_gateway_limit burst=30 nodelay;
    proxy_pass http://trip_service;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

location ~ ^/api/v1/admin/(users|payments/topups) {
    limit_req zone=api_gateway_limit burst=20 nodelay;
    proxy_pass http://auth_service;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

# --- 4a. Rutas de autenticación sensibles a fuerza bruta (login/PIN) ---
location ~ ^/api/v1/auth/(login|register|forgot-password|reset-password|send-verification-code) {
    limit_req zone=auth_limit burst=5 nodelay;
    proxy_pass http://auth_service;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

# --- 4b. Microservicio de Autenticación e Identidad (:8001) ---
location ~ ^/api/v1/(auth|institutions|user|wallet|driver/register) {
    limit_req zone=api_gateway_limit burst=20 nodelay;
    proxy_pass http://auth_service;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

# --- 4c. Webhook de Wompi — una sola cuenta de comercio para ambos
# servicios (recargas de billetera WR- en auth-service, pagos de viaje
# TP- en trip-service). Wompi solo admite UNA URL de webhook por
# cuenta, así que se espeja la petición a los dos: cada handler ya
# ignora las referencias que no le corresponden (ver comentarios en
# WalletController::wompiWebhook y TripPaymentController::wompiWebhook).
location = /api/v1/webhooks/wompi {
    limit_req zone=api_gateway_limit burst=10 nodelay;
    mirror /_mirror_wompi_auth;
    mirror_request_body on;
    proxy_pass http://trip_service;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

location = /_mirror_wompi_auth {
    internal;
    proxy_pass http://auth_service/api/v1/webhooks/wompi;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

# --- 5. Microservicio de Vehículos y Documentos (:8002) ---
location ~ ^/api/v1/vehicles {
    limit_req zone=api_gateway_limit burst=20 nodelay;
    proxy_pass http://vehicle_service;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

# --- 6. Microservicio Geoespacial y Matching PostGIS (:8003) ---
location ~ ^/api/v1/routes {
    limit_req zone=api_gateway_limit burst=30 nodelay;
    proxy_pass http://route_matching_service;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

# --- 7. Microservicio de Ciclo de Vida del Viaje y Telemetría (:8004) ---
location ~ ^/api/v1/trips/[^/]+/tracking {
    limit_req zone=tracking_limit burst=50 nodelay;
    proxy_pass http://trip_service;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

location ~ ^/api/v1/(trips|passenger) {
    limit_req zone=api_gateway_limit burst=30 nodelay;
    proxy_pass http://trip_service;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

# --- 8. Microservicio de Notificaciones Push (:8005) ---
location ~ ^/api/v1/(notifications|users|push) {
    limit_req zone=api_gateway_limit burst=20 nodelay;
    proxy_pass http://notification_service;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

# --- 9. Microservicio de Inteligencia Artificial FastAPI (:8006) ---
location ~ ^/api/v1/(optimize|ai) {
    limit_req zone=api_gateway_limit burst=30 nodelay;
    proxy_pass http://ai_route_service;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}
